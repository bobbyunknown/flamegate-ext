name: Release extension

on:
  push:
    tags:
      - "*-v*" # e.g. cline-v0.1.0, xiaomi-mimo-v0.1.0
  workflow_dispatch:
    inputs:
      slug:
        description: "Extension slug to build & release"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cline
          - xiaomi-mimo
          - antigravity
      version:
        description: "Version override (leave empty to use version from schema.json)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup TinyGo (for Go/TinyGo WASM extensions)
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.40.1"

      - name: Setup Rust & wasm32 target (for Rust WASM extensions)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build publisher CLI tool
        run: |
          go build -C publisher -o /usr/local/bin/flamegate-publisher .

      - name: Determine extensions to build
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            SLUG="${TAG%-v*}"
            VERSION="${TAG##*-v}"
            echo "items=[{\"slug\":\"$SLUG\",\"version\":\"$VERSION\",\"tag\":\"$TAG\"}]" >> "$GITHUB_OUTPUT"
          else
            SELECTED="${{ inputs.slug }}"
            VERSION_INPUT="${{ inputs.version }}"

            if [ "$SELECTED" = "all" ]; then
              SLUGS="cline xiaomi-mimo antigravity"
            else
              SLUGS="$SELECTED"
            fi

            ITEMS="[]"
            for s in $SLUGS; do
              if [ -n "$VERSION_INPUT" ]; then
                v="$VERSION_INPUT"
              else
                v=$(jq -r '.version // "0.1.0"' "$s/schema.json")
              fi
              t="${s}-v${v}"
              ITEMS=$(echo "$ITEMS" | jq --arg s "$s" --arg v "$v" --arg t "$t" '. + [{"slug": $s, "version": $v, "tag": $t}]')
            done
            COMPACT=$(echo "$ITEMS" | jq -c .)
            echo "items=$COMPACT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, bundle, and release extensions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLAMEGATE_SIGNING_KEY: ${{ secrets.FLAMEGATE_SIGNING_KEY }}
          ITEMS_JSON: ${{ steps.plan.outputs.items }}
        run: |
          echo "$ITEMS_JSON" | jq -c '.[]' | while read -r item; do
            slug=$(echo "$item" | jq -r '.slug')
            version=$(echo "$item" | jq -r '.version')
            tag=$(echo "$item" | jq -r '.tag')
            zip_name="${slug}-${version}.zip"

            echo "=========================================================="
            echo "Building extension: $slug (version: $version, tag: $tag)"
            echo "=========================================================="
            flamegate-publisher build "$slug"

            echo "Bundling extension: $slug"
            flamegate-publisher bundle "$slug" "$version" --out "$zip_name"

            echo "Creating/updating GitHub Release: $tag"
            gh release create "$tag" "$zip_name" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --generate-notes || {
                gh release upload "$tag" "$zip_name" --repo "${{ github.repository }}" --clobber
              }

            echo "Successfully released $slug ($tag)"
          done
